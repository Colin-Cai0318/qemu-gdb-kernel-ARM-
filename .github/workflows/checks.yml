name: Lab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y cpio kmod
      - name: Check shell and JSON syntax
        run: ./scripts/check.sh
      - name: Reject incomplete and false-positive experiment evidence
        run: python3 -m unittest discover -s tests -v
